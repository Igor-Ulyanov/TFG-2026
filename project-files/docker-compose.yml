services:

  postgres:
    image: postgres:16
    container_name: data-storage
    restart: always
    environment:
      POSTGRES_DB: access_control_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d

  api:
    build: 
      context: ./backend/auth-api
      dockerfile: Dockerfile
    container_name: auth-api
    restart: always
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    env_file:
    - api-rest.env

volumes:
  postgres_data: