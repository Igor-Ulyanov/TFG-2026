version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: data-storage
    restart: always
    environment:
      POSTGRES_DB: access_control_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d

volumes:
  postgres_data: 